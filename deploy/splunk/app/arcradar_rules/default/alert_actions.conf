# The custom alert action every saved search written by ArcRadar uses ("action.arcradar_forward = 1").
# It runs bin/arcradar_forward.py, which reports the triggered result to ArcRadar.
[arcradar_forward]
is_custom = 1
label = Send to ArcRadar
description = Reports the triggered result to ArcRadar
payload_format = json
python.version = python3
# Filled in by the saved search (see README/alert_actions.conf.spec).
param.rule_key =
param.name =
param.severity = medium
param.mitre =
