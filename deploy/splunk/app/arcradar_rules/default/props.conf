# Search-time field extractions for the classic Windows Security event log, so the rules ArcRadar writes
# (EventCode, Source_Network_Address, Account_Name) work without the Splunk Add-on for Microsoft Windows.
# If that add-on is installed it extracts the same field names; these only fill the gap when it is not.
#
# A failed logon (EventCode 4625) reads, in part:
#   Account For Which Logon Failed:
#       Account Name:           administrator
#   Network Information:
#       Source Network Address: 203.0.113.55
[WinEventLog:Security]
EXTRACT-arcradar_source_ip = Source Network Address:\s+(?<Source_Network_Address>[0-9A-Fa-f:.]+)
EXTRACT-arcradar_failed_account = Account For Which Logon Failed:[\s\S]*?Account Name:\s+(?<Account_Name>\S+)
