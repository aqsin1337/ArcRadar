# ArcRadar local reverse proxy.
# For local development and production-like testing on this machine only. Vercel does not use nginx.
#
#   browser  ->  nginx (127.0.0.1:8080)  ->  Next.js (127.0.0.1:3000)
#
# Manage it with:  powershell -File scripts/nginx.ps1 <test|start|stop|reload>
# Relative `include` paths resolve next to this file; log/pid paths resolve under the -p prefix
# that scripts/nginx.ps1 sets to deploy/nginx/runtime.

worker_processes 1;
error_log logs/arcradar-error.log warn;
pid       logs/arcradar-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    access_log    logs/arcradar-access.log;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The Next.js dev server uses WebSockets for hot reload.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Coarse abuse protection for API calls. Application-level rate limits arrive in the security phase.
    limit_req_zone $binary_remote_addr zone=arcradar_api:10m rate=30r/s;
    limit_req_status 429;

    upstream arcradar_app {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # Response headers grew past nginx's small defaults (4k/8k) once Phase 11 added a per-request
    # Content-Security-Policy plus nonce'd font-preload Link headers on top of an existing session
    # cookie's JWT: nginx refused those responses with "upstream sent too big header" (a 502, found
    # by the smoke suite running through this proxy, never seen hitting the app directly). Every
    # response is buffered here regardless of size, so generous headroom costs nothing at this scale.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        client_max_body_size 2m;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;

        location /api/ {
            limit_req zone=arcradar_api burst=60 nodelay;
            proxy_pass http://arcradar_app;
        }

        location / {
            proxy_pass http://arcradar_app;
        }
    }
}
